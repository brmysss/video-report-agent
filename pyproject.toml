[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-report-agent"
version = "0.1.0"
description = "Bilibili to HTML reports with ASR and Pi RPC"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "opencc-python-reimplemented>=0.1.7",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
video-report = "video_report_agent.cli:main"

[project.optional-dependencies]
enhancement = [
    "onnxruntime>=1.29.0",
    "pysubs2>=1.9.0",
    "rapidocr>=3.9.0",
]
mlx = [
    "mlx-whisper>=0.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
